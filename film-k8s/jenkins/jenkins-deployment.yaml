apiVersion: apps/v1
kind: Deployment

metadata:
  name: jenkins
  namespace: jenkins

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jenkins

  template:
    metadata:
      labels:
        app: jenkins

    spec:
      nodeName: cp1

      serviceAccountName: jenkins

      containers:
      - name: jenkins

        image: kadir57/jenkins-custom:latest

        securityContext:
          privileged: true
          runAsUser: 0

        ports:
        - containerPort: 8080
        - containerPort: 50000

        volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home

        - name: docker-sock
          mountPath: /var/run/docker.sock

      volumes:
      - name: jenkins-home
        persistentVolumeClaim:
          claimName: jenkins-pvc

      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
