apiVersion: apps/v1
kind: Deployment
metadata:
  name: film-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: film-web
  template:
    metadata:
      labels:
        app: film-web
    spec:
      containers:
        - name: film-web
          image: kadir57/film-site:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
