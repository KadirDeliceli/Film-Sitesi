version: '3.8'

services:
  web:
    build: .
    container_name: film_web
    volumes:
      - ./app:/var/www/html
    ports:
      - "8090:80"
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: film_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: film
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: film_pma
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db

volumes:
  db_data:
